<h2>Meu formulário</h2>
<p>Preencha as informações abaixo</p>

<form id="formRegister">

    Nome:
    <input 
        id="iName" 
        type="text" 
        placeholder="Digite seu nome completo"
    />

    Email:
    <input
        id="iEmail" 
        type="email"
        placeholder="Digite o seu melhor email"
    />

    <br>

    Senha:
    <input
        id="iPass" 
        type="password"
        placeholder="Letra maiúscula e números"
    />

    Data de nascimento:
    <input
        id="iBirth" 
        type="date"
    />

    <br>

    <button type="submit">Salvar</button>

</form>

<form id="formLogin">
    Email: <input id="iEmailLogin"  type="email" placeholder="Digite o seu email cadastro" />
    <br>
    Senha: <input id="iPassLogin"  type="password" placeholder="Digite sua senha cadastrada" />
    <br>
    <button type="submit">Entrar</button>
</form>

<h2>Resposta</h2>
<pre id="pResponse"></pre>
