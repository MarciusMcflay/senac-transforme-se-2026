<head>
    <title>Aula 9</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h3 id="hello"></h3>

    <div class="h-full flex">
        <div class="fixed p-5 bg-about rounded-lg shadow-md flex column">
            <h2>Cadastre um novo usuário</h2>
            <p>Preencha as informações abaixo</p>

            <form id="formRegister" class="flex column">

                Nome:
                <input id="iName" type="text" placeholder="Digite seu nome completo" />

                Email:
                <input id="iEmail" type="email" placeholder="Digite o seu melhor email" />

                <br>

                Senha:
                <input id="iPass" type="password" placeholder="Letra maiúscula e números" />

                Data de nascimento:
                <input id="iBirth" type="date" />

                <br>

                <a class="mt-5 bg-primary text-white text-center rounded-md py-2">Salvar</a>

            </form>
        </div>

        <pre id="listUsers"></pre>
    </div>
    

    <script src="user.js"></script>
</body>

</html>
